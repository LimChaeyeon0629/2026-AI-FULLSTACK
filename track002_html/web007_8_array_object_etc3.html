<!DOCTYPE html>
<html lang="ko">
<head>
  <title>Avengers Members - Ajax Fetch</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container my-3">
  <h3 class="card-header">Avengers Members</h3> 
  <table class="table table-striped table-bordered" id="memberTable">
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Age</th>
        <th>Address</th>
        <th>Mobile</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
 

<script>
  fetch("./data/member.xml")
    .then(res=> res.text()
    )
    .then(xml=> {
      let parser = new DOMParser(); // Dom 인스턴스(도구) 사용
      let xmlDoc = parser.parseFromString(xml, "application/xml");

      console.log(xmlDoc)
      let mem = xmlDoc.getElementsByTagName("member");
      // console.log(mem);
      // console.log(mem[0].getElementsByTagName("name"))
      // console.log(mem[0].getElementsByTagName("name")[0])


      // let result = "";
      // for(let i=0; i<mem.length; i++) {
      //   let name = mem[i].getElementsByTagName("name")[0].textContent;
      //   let age = mem[i].getElementsByTagName("age")[0].textContent;
      //   let address = mem[i].getElementsByTagName("address")[0].textContent;
      //   let mobile = mem[i].getElementsByTagName("mobile")[0].textContent;
      //   let img = mem[i].getElementsByTagName("img")[0].textContent;
      //   result += `<tr>
      //                 <td><img src ="${img}" width="50"></td>
      //                 <td>${name}</td>
      //                 <td>${age}</td>
      //                 <td>${address}</td>
      //                 <td>${mobile}</td>
      //               </tr>`;
      // }
      

      let result = "";
      for( let m of mem ) { // in - index, of - value
        // console.log( m, typeof(m) ); // String
        let name = m.getElementsByTagName("name")[0].textContent;
        let age = m.getElementsByTagName("age")[0].textContent;
        let address = m.getElementsByTagName("address")[0].textContent;
        let mobile = m.getElementsByTagName("mobile")[0].textContent;
        let img = m.getElementsByTagName("img")[0].textContent;

        result += `<tr>
                      <td><img src="${img}" alt="${name}" class="w-100"></td>
                      <td>${name}</td>
                      <td>${age}</td>
                      <td>${address}</td>
                      <td>${mobile}</td>
                    </tr>`;
      }

      document.querySelector("#memberTable tbody").innerHTML = result;
    })
    .catch(err=> {
      // document.querySelector("#memberTable tbody") = "에러 발생: " + err.message;
    });
</script>
</body>
</html>
